[project]
name = "roomfinder"
version = "0.1.0"
description = "Monitors apartment rental sites and sends alerts about new listings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    # Must match the version of the Playwright base image in the Dockerfile
    "playwright==1.63.0",
    "beautifulsoup4>=4.15",
    "lxml>=6.1",
    "python-telegram-bot[rate-limiter]>=22.8",
    "segno>=1.6",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    # Test client transport for starlette's TestClient
    "httpx2>=2.13",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roomfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
