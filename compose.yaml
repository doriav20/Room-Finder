name: roomfinder

services:
  app:
    build: .
    image: roomfinder:latest
    container_name: roomfinder
    # A fixed hostname keeps Chrome's profile lock consistent across container re-creation
    hostname: roomfinder
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Jerusalem
    ports:
      # The dashboard, the only way in (sign-in required; the container's browser is inside it)
      - "127.0.0.1:8000:8000"
    volumes:
      - roomfinder-data:/data
    # Chrome needs more shared memory than Docker's 64MB default
    shm_size: 1gb
    restart: unless-stopped
    # It runs for months at a time: keep at most 50MB of logs (docker compose logs still works)
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  # The dashboard on your own domain through a Cloudflare Tunnel (see HOSTING.md). It connects
  # out to Cloudflare, so no router port is opened. Runs only with COMPOSE_PROFILES=tunnel in .env
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: roomfinder-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    profiles: ["tunnel"]
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  roomfinder-data:
