<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}RoomFinder{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/bootstrap.rtl.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5" style="max-width: 26rem">
    <div class="text-center mb-4">
      <div class="display-6">🏠</div>
      <h1 class="h4 fw-bold">RoomFinder</h1>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
        {% block content %}{% endblock %}
      </div>
    </div>
  </main>
</body>
</html>
