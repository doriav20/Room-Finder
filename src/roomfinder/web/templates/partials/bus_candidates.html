{% if error %}
<div class="alert alert-warning mb-0">{{ error }}</div>
{% elif not candidates %}
<div class="small text-body-secondary">לא נמצא קו {{ number }}.</div>
{% else %}
<div class="list-group">
  {% for line in candidates %}
  <form class="list-group-item d-flex align-items-center gap-2" method="post" action="/settings/bus-lines">
    <input type="hidden" name="key" value="{{ line.key }}">
    <div class="flex-grow-1">
      <strong>קו {{ line.number }}</strong> · {{ line.agency }}
      <div class="small text-body-secondary">{{ line.description }}</div>
    </div>
    {% if line.key in chosen %}<span class="badge text-bg-secondary">נבחר</span>{% else %}<button class="btn btn-sm btn-primary">הוסף</button>{% endif %}
  </form>
  {% endfor %}
</div>
{% endif %}
