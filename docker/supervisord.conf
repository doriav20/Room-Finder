[supervisord]
nodaemon=true
user=root
; In the foreground supervisord already echoes its log (process starts, exits, restarts)
; to the container log, so no separate log file
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Virtual screen that Chrome renders into
[program:xvfb]
command=Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
priority=10
autorestart=true
; Xvfb prints dozens of harmless keyboard-map warnings on start
stdout_logfile=/dev/null
redirect_stderr=true

[program:fluxbox]
command=fluxbox
priority=20
autorestart=true
startretries=10
stdout_logfile=/dev/null
redirect_stderr=true

; VNC server on the virtual screen, reachable only from inside the container. Admins see it
; in the dashboard at /novnc, which checks the sign-in (see web/novnc.py)
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -quiet
priority=30
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chrome]
command=bash /app/docker/start-chrome.sh
priority=50
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/chrome.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true

[program:app]
command=bash /app/docker/start-app.sh
priority=60
autorestart=true
startretries=10
; Only the app gets the stop signal, so it can end runs and close Playwright's driver itself
stopasgroup=false
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
